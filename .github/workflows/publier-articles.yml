name: Publication programmée des articles

# Chaque matin vers 5 h 15 (heure de Montréal), publie les articles de
# contenu/articles/ dont la date est arrivée (outils/publier.py), puis pousse
# le résultat sur main, donc sur le site en ligne.
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier-articles
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publier les articles dus
        run: python3 outils/publier.py

      - name: Enregistrer et pousser sur main
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Rien à publier aujourd'hui."
            exit 0
          fi
          git config user.name "Publication programmée"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blog : publication programmée du $(TZ=America/Montreal date +%Y-%m-%d)"
          git push origin HEAD:main
